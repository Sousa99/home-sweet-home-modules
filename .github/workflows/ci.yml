name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  format:
    name: 🧹 Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com/

      - name: 📦 Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: 🧹 Prettier check
        run: pnpm format

  lint:
    name: 🚨 Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com/

      - name: 📦 Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: 🚨 ESLint
        run: pnpm lint

  typecheck:
    name: 🔍 Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com/

      - name: 📦 Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: 🔍 TypeScript check (all packages)
        run: pnpm typecheck

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com/

      - name: 📦 Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: 🧪 Unit tests (all packages)
        run: pnpm test

  build-backends:
    name: 🏗️ Build backends
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [fly-over-tracker, procrastinator-tracker, bus-catcher]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com/

      - name: 📦 Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Backend build (${{ matrix.module }})
        run: pnpm --filter ./modules/${{ matrix.module }}/backend build

  build-spas:
    name: 🖼️ Build SPAs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [current-time, fly-over-tracker, procrastinator-tracker, bus-catcher]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com/

      - name: 📦 Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: 🖼️ SPA build (${{ matrix.module }})
        run: pnpm --filter ./modules/${{ matrix.module }}/frontend build

  build-libs:
    name: 📦 Build libraries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [current-time, fly-over-tracker, procrastinator-tracker, bus-catcher]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com/

      - name: 📦 Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: 📦 Library build (${{ matrix.module }})
        run: pnpm --filter ./modules/${{ matrix.module }}/frontend build:lib

  actionlint:
    name: 🔬 actionlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🔬 Check workflow files
        uses: docker://rhysd/actionlint:latest

      - name: 🔬 Verify release version command
        run: |
          grep -Eq '^\s*version: pnpm changeset version$' .github/workflows/release.yml \
            || { echo "::error::release.yml changesets 'version' must be 'pnpm changeset version' (pnpm version is the built-in, not changesets)."; exit 1; }

  pr-format:
    name: 📝 PR format
    runs-on: ubuntu-latest

    steps:
      - name: 📝 Validate PR title and branch
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          TITLE_RE='^(feat|fix|chore|docs|refactor|test|build|ci|style|perf|revert)(\([^)]+\))?:[[:space:]]+.+'
          BRANCH_RE='^(feature|fix)/[0-9]{3}-[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$PR_TITLE" =~ $TITLE_RE ]]; then
            echo "::error::PR title must match '<type>(<scope>)?: <subject>' (types: feat, fix, chore, docs, refactor, test, build, ci, style, perf, revert)."
            exit 1
          fi
          if [[ ! "$HEAD_REF" =~ $BRANCH_RE ]]; then
            echo "::error::Branch name must match 'feature/NNN-kebab-case'."
            exit 1
          fi
          echo "✅ PR title and branch formats OK"

  check:
    name: ✅ Check
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test, build-backends, build-spas, build-libs, actionlint, pr-format]

    steps:
      - name: ✅ All required checks passed
        run: echo "All required checks passed."