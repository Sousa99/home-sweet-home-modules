server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional /api reverse proxy to the module backend (written by
    # /docker-entrypoint.d/40-backend-upstream.sh when BACKEND_UPSTREAM is set).
    include /etc/nginx/conf.d/proxy/*.conf;
}
