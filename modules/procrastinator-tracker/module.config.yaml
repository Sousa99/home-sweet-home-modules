# Module identity
module_name: Procrastinator Tracker
module_slug: procrastinator-tracker
module_description: Local-first task tracker with REST + MCP backend and a React SPA frontend

# Registries / ownership
npm_scope: sousa99
repo_owner: sousa99
repo_name: procrastinator-tracker
ghcr_org: ghcr.io/sousa99

# Package organization (both optional, at least one required)
packages:
  - backend
  - frontend

# Technology baseline (rendered into README stack table + setup.md)
stack:
  backend: Node 24, Hono, Drizzle ORM, SQLite
  frontend: Vite, React 19, Tailwind CSS v4
  tooling: pnpm 11, TypeScript, ESLint, Prettier, Vitest

# Umbrella identity (placeholder until a Home Sweet Home org/hub exists)
umbrella_link: https://github.com/

# Styling theme (config-driven; defaults match the Home Sweet Home reference theme)
theme:
  primary: '#d97706'
  font_sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif

# Docs-only backend display values (never wired into runtime code)
backend:
  http_entry: --http
  mcp_entry: --mcp
